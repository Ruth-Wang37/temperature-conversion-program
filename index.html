<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Conversion Program</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <form>
        <h1>Temperature conversion:</h1>
        <input type="number" id="text" value="0"><br>

        <input type="radio" id="toFahrenheit" name="unit">
        <label for="toFahrenheit">Celcius -> Fahrenheir</label><br>

        
        <input type="radio" id="toCelcius" name="unit">
        <label for="toCelcius">Fahrenheir  -> Celcius</label><br>

        <button type="button" onclick="">submit</button>

    </form>

    <script src="index.js"></script>
</body>
</html>
